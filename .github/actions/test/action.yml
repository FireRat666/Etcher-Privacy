---
name: test release
# https://github.com/product-os/flowzone/tree/master/.github/actions
inputs:
  json:
    description: 'JSON stringified object containing all the inputs from the calling workflow'
    required: true
  secrets:
    description: 'JSON stringified object containing all the secrets from the calling workflow'
    required: true

  # --- custom environment
  NODE_VERSION:
    type: string
    default: '24'
  VERBOSE:
    type: string
    default: 'true'

runs:
  # https://docs.github.com/en/actions/creating-actions/creating-a-composite-action
  using: 'composite'
  steps:
    # https://github.com/actions/setup-node#caching-global-packages-data
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.NODE_VERSION }}
        cache: npm

    - name: Install host dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libudev-dev
        cat < package.json | jq -r '.hostDependencies[][]' - | \
          xargs -L1 echo | sed 's/|//g' | xargs -L1 \
          sudo apt-get --ignore-missing install || true

    - name: Install host dependencies
      if: runner.os == 'macOS'
      # FIXME: Python 3.12 dropped distutils that node-gyp depends upon.
      # This is a temporary workaround to make the job use Python 3.11 until
      # we update to npm 10+.
      uses: actions/setup-python@d27e3f3d7c64b4bbf8e4abfb9b63b83e846e0435 # v4
      with:
        python-version: '3.11'

    - name: Setup node-gyp for VS2026
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # npm's git-dependency build uses an isolated node-gyp (10.3.1) that
        # cannot detect Visual Studio 2026.  Install node-gyp 12.4.0
        # globally and tell npm to use it for every native build.
        npm install -g node-gyp@12.4.0
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $gypPath = Join-Path (npm prefix -g) 'node_modules\node-gyp\bin\node-gyp.js'
        if (-not (Test-Path $gypPath)) {
          Write-Error "node-gyp JS entrypoint not found at $gypPath"
          exit 1
        }
        Write-Host "Using global node-gyp at: $gypPath"
        npm config set node-gyp "$gypPath"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        echo "npm_config_node_gyp=$gypPath" >> $env:GITHUB_ENV

    - name: Test release
      shell: bash
      run: |
        ## FIXME: causes issues with `xxhash` which tries to load a debug build which doens't exist and cannot be compiled
        # if [[ '${{ inputs.VERBOSE }}' =~ on|On|Yes|yes|true|True ]]; then
        #   export DEBUG='electron-forge:*,sidecar'
        # fi

        npm ci

        # the shrinkwrap pins winusb-driver-generator, so npm ci already installs
        # it; verify it is present instead of reinstalling it
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          npm ls winusb-driver-generator
        fi

        npm run lint
        npm run package
        npm run wdio # test stage, note that it requires the package to be done first

      env:
        # https://www.electronjs.org/docs/latest/api/environment-variables
        ELECTRON_NO_ATTACH_CONSOLE: 'true'

    - name: Compress custom source
      if: runner.os != 'Windows'
      shell: bash
      run: tar -acf ${{ runner.temp }}/custom.tgz .

    - name: Compress custom source
      if: runner.os == 'Windows'
      shell: pwsh
      run: C:\"Program Files"\Git\usr\bin\tar.exe --force-local -acf ${{ runner.temp }}\custom.tgz .

    - name: Upload custom artifact
      uses: actions/upload-artifact@v4
      with:
        name: custom-${{ github.event.pull_request.head.sha || github.event.head_commit.id }}-${{ runner.os }}-${{ runner.arch }}
        path: ${{ runner.temp }}/custom.tgz
        retention-days: 1
