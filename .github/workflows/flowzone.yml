name: Flowzone
on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ['v*']
jobs:
  flowzone:
    name: Flowzone
    uses: product-os/flowzone/.github/workflows/flowzone.yml@master
    secrets:
      FLOWZONE_TOKEN: ${{ secrets.FLOWZONE_TOKEN || secrets.GITHUB_TOKEN }}
    with:
      custom_test_matrix: >
        {
          "os": [
            ["ubuntu-22.04"],
            ["windows-2022"],
            ["macos-14-large"],
            ["macos-latest-xlarge"]
          ]
        }
      custom_publish_matrix: >
        {
          "os": [
            ["ubuntu-22.04"],
            ["windows-2022"],
            ["macos-14-large"],
            ["macos-latest-xlarge"]
          ]
        }
      github_prerelease: true
