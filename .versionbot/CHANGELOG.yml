      hash: 5b75983ff39839494c0f0cee26239f386ca7f867
      body: >-
        - Add Flowzone workflow triggering on pull requests and pushes to
        master, with four-OS test and publish matrices

        - Add test action running lint, packaging, and wdio on Node 20.19,
        verifying winusb-driver-generator instead of reinstalling it

        - Add publish action producing unsigned Windows, macOS, and Linux
        installers, with signing steps that run only when certificate secrets
        are present

        - Remove unused Sentry and Amplitude analytics tokens from the publish
        action

        - Gate macOS and Windows signing in forge.config.ts on signing secrets
        so unsigned builds skip code-signing cleanly
