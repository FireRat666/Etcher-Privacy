- commits:
    - subject: update .nvmrc
      hash: c2bf65eee04b1d662e4cb7ab76b999a758b2b9d3
      body: ""
      footer: {}
      author: FireRat
    - subject: Fix node-gyp binary resolution for Electron builds
      hash: a8b2f2c93fde5b9f2d4e52f613efa330979b05cf
      body: |-
        - Add postinstall script to create cross-platform node-gyp shims
        - Downgrade utf-8-validate to v5 for compatibility
        - Override @electron/node-gyp to use node-gyp v11
        - Regenerate npm-shrinkwrap.json
      footer: {}
      author: FireRat
    - subject: "Fix Windows test job: approve install scripts and force-install
        winusb-driver-generator"
      hash: 8485236864238b281d7d4bfc85846d84197b2352
      body: >-
        package.json: add allowScripts policy approving install scripts for 19
        native/build packages (electron, esbuild, drivelist, etc.) so npm
        11.16's allow-scripts gate runs them during npm ci instead of skipping
        them


        package.json: pre-approve winusb-driver-generator@2.1.10 so its install
        script runs when force-installed


        .github/actions/test/action.yml: on Windows, install
        winusb-driver-generator with --force (bypassing its engines >=20 < 23
        check on Node 24) via --no-save --package-lock=false before the npm ls
        verification
      footer: {}
      author: FireRat
    - subject: Fix node-gyp binary resolution for Electron builds
      hash: 8fdfab3dda52fc2d506d93805f9b41591937a8a3
      body: |-
        - Add postinstall script to create cross-platform node-gyp shims
        - Downgrade utf-8-validate to v5 for compatibility
        - Override @electron/node-gyp to use node-gyp v11
        - Regenerate npm-shrinkwrap.json
      footer: {}
      author: FireRat
    - subject: Share the custom app event contract between registration and emission
      hash: 24ca51702ad61e8499730f48a3291f4338066216
      body: >-
        - Extract CustomAppEvents and onCustomAppEvent from etcher.ts into a
        shared custom-app-events module

        - Add a typed emitCustomAppEvent wrapper and use it in menu.ts for the
        edit-config-file event, keeping event names compile-time checked on both
        sides
      footer: {}
      author: FireRat
    - subject: Fix sidecar Node ABI mismatch by packaging with Node 24
      hash: 9f75a6fa4d6a38dffcb29620905af7963c70559e
      body: >-
        - Upgrade @yao-pkg/pkg to 6.22.0 (pkg-fetch 3.6.5) so Node 24 base
        binaries are available

        - Target node24 for the sidecar executable instead of node20, matching
        the Node 24 build environment and fixing the mountutils dlopen failure
        at the end of flashing
      footer: {}
      author: FireRat
    - subject: Require Node 24 and update CI tooling
      hash: 2d9bf0a4d2c4a4453293f78fbec7fe5c9e8c912c
      body: >-
        - Raise the engines requirement to Node >=24 in package.json and the
        shrinkwrap

        - Default the publish and test workflow actions to Node 24 and upgrade
        actions/setup-node to v4

        - Pass the target arch to the mountutils rebuild via npm_config_arch
        instead of the --arch flag

        - Remove a stale nested utf-8-validate entry from the lockfile
      footer: {}
      author: FireRat
    - subject: '- Fix the punctuation of the forge.config.mts publishing note from
        "eg." to "e.g.," - Define a CustomAppEvents contract with a typed
        onCustomAppEvent helper, replacing the as any casts on the
        edit-config-file and relaunch listeners - Narrow focusedWindow with an
        instanceof BrowserWindow check in all back/forward menu handlers,
        replacing the type casts'
      hash: d7b3d559caffa79a1258b201398fe9cd0f862563
      body: ""
      footer: {}
      author: FireRat
    - subject: Prettify store.ts formatting to satisfy catch-uncommitted
      hash: 70b5052a7b88de1a5fba0c8a2c6b907afe50f55c
      body: ""
      footer: {}
      author: FireRat
    - subject: Reset version to 2.1.6-P and fix remaining TypeScript errors
      hash: 65606d54a2d7d85cd0dfc7c5ef4cb328e2c0805e
      body: >-
        - Revert the 2.1.7 bump back to 2.1.6-P in package.json, shrinkwrap,
        changelog, and versionbot state, merging changelog entries under one
        heading

        - Rename forge.config.ts to forge.config.mts with explicit .ts import
        extensions, enabling allowImportingTsExtensions

        - Add a webkit-app-region module declaration and remove the @ts-ignore
        it replaces

        - Fix the remaining TypeScript errors: typed immutable state casts, a
        discriminated union for sidecar connection results, styled-component
        generic constraints, stricter callback/event param typing, and explicit
        return paths

        - Allow the optional tooltip on settings entries and use the modal title
        prop instead of titleElement
      footer: {}
      author: FireRat
    - subject: v2.1.7
      hash: be347353ff9bbd08ea2f5066a2096e08229c50ed
      body: "[skip ci]"
      footer: {}
