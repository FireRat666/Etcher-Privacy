    - subject: Make internal windows robust and replace electron-log with the builtin
        console logger
      hash: 327d7cddfcb9b4bbcd12e06e7da86083dc1a8e64
      body: >-
        Rework open-internal into a shared internal-window module used by both
        the

        main process and the remote renderer service, so any URL type
        (http/https,

        chrome://, file://, etc.) opens in a properly secured BrowserWindow.


        Add a did-fail-load handler and catch load errors to render a dark error
        page

        in the window instead of leaving a blank one, and re-open target=_blank
        and

        window.open popups as new internal windows.


        Replace every electron-log call with the builtin console logger
        (info/warn/

        error) across the main process and renderer, so all log output goes to
        the

        console and no log files are written.


        Remove the electron-log dependency from package.json and
        npm-shrinkwrap.json.


        Drop the unused SENTRY_TOKEN DefinePlugin from webpack.config.ts, the
        last

        remaining Sentry reference in the codebase.


        Clear the completed TODO.md items.
      footer: {}
      author: FireRat
