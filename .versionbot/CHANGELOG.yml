- commits:
    - subject: "build: fail install when the node-gyp util patch target is missing"
      hash: 7768863542bbaba425fde6274ffa43cea644488e
      body: "- scripts/fix-node-gyp-bin.js: verify content.replace() actually changed
        the wrapper source before writing; if the cp.execFile pattern is absent,
        log a warning and exit non-zero so postinstall fails instead of silently
        writing the file unchanged"
      footer: {}
      author: FireRat
    - subject: "build: align sidecar rebuilds with pkg node24 and reuse setupWinNodeGyp"
      hash: 4fa5d8fe28172b3e5e11675188391085e952969e
      body: >-
        - forge.sidecar.ts: pin native-module rebuild target to Node 24.18.1,
        matching pkg's node24 runtime, instead of the host's
        process.versions.node

        - scripts/setup-win-node-gyp.js: expose the global node-gyp path as
        npm_config_node_gyp via GITHUB_ENV

        - .github/actions/publish/action.yml: replace duplicated PowerShell
        node-gyp setup with the setupWinNodeGyp script
      footer: {}
      author: FireRat
    - subject: "fix: harden CI, sidecar lifecycle, and drive-source checks"
      hash: 9b2c3aa0cd6005b9cc15bf32a159c03f610338ee
      body: >-
        - ci: fail macOS artifact upload when no files are produced and run the
        skipped postinstall before rebuilding host tools

        - ci: restrict Windows ARM64 upload to ZIP artifacts and bump
        action-gh-release to v3

        - ci: align regression matrix with flowzone using ubuntu-24.04 and
        windows-2025

        - fix: guard the window-show fallback against a destroyed mainWindow and
        clear its timeout when the window closes

        - fix: rely on normalized path checks for drive containment and add a
        traversal escape regression test

        - fix: route sidecar write/scan failures through handleError and
        guarantee termination after cleanup

        - build: centralize Visual Studio detection via vswhere with a fallback
        list in a shared helper

        - build: fix the node-gyp patch idempotency guard, exclude array
        options, and log patch failures

        - build: fail npm install when lzma-native source is neither patched nor
        patchable

        - build: honor npm_config_arch for the ARM64 lzma patch and keep
        node-gyp setup optional
      footer: {}
      author: FireRat
    - subject: "ci: speed up Windows ARM64 build"
      hash: 247190f6707421e4f1b687c3a8513b7561e88ef1
      body: >-
        Cache Electron and electron-gyp downloads under AppData\Local on Windows
        ARM64 so the CI job reuses them across runs.

        Switch git dependencies to https to avoid slow SSH clones during npm ci.
      footer: {}
      author: FireRat
