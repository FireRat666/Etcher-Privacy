    - subject: Enable Flowzone's built-in versioning
      hash: c6428ad567132baa96cf387ce11bcc9a1d6b1fce
      body: "- Drop the disable_versioning flag from the Flowzone workflow so it
        resumes handling version bumps and releases"
      footer: {}
      author: FireRat
    - subject: Bump version to 2.1.6-P and take over versioning from Flowzone
      hash: 6d5a5b7df13727c90202e10e6770ecec4d2785c5
      body: >-
        - Run the Flowzone pipeline on v-prefixed tags and disable its built-in
        versioning

        - Bump the app version to 2.1.6-P in package.json and the changelog
        heading
      footer: {}
      author: FireRat
    - subject: Fall back to GITHUB_TOKEN for Flowzone and normalize changelog heading
      hash: 70884f3fb441793294547c69b0a264d710d0b281
      body: >-
        - Use GITHUB_TOKEN as a fallback for FLOWZONE_TOKEN in the Flowzone
        workflow

        - Rename the changelog version heading to the v-prefixed format (v2.1.6)
      footer: {}
      author: FireRat
    - subject: Add versionist config and dependencies manifest
      hash: cd57c7b5aa86b3458eb7741ec4139e3a5a00ca50
      body: >-
        - Configure versionist to tag versions with a v-prefix and prepend
        changelog entries from line 5

        - Bump the patch version for every commit using the default template

        - Add an empty dependencies.yml manifest
      footer: {}
      author: FireRat
    - subject: Pass the FLOWZONE_TOKEN secret to the Flowzone workflow explicitly
      hash: 67041c5af2f46d715bd13f77eebf8cc3992055d4
      body: "- Replace secrets: inherit with an explicit secret mapping, since the
        repo and the product-os/flowzone reusable workflow are not in the same
        organization or enterprise and inherit silently passes nothing"
      footer: {}
      author: FireRat
    - subject: Trigger CI after adding FLOWZONE_TOKEN
      hash: a8a16ad5bb9be69a87778e98d431fffd039badc7
      body: ""
      footer: {}
      author: FireRat
    - subject: Add Flowzone CI pipeline and make unsigned builds first-class
      hash: 5b75983ff39839494c0f0cee26239f386ca7f867
      body: >-
        - Add Flowzone workflow triggering on pull requests and pushes to
        master, with four-OS test and publish matrices

        - Add test action running lint, packaging, and wdio on Node 20.19,
        verifying winusb-driver-generator instead of reinstalling it

        - Add publish action producing unsigned Windows, macOS, and Linux
        installers, with signing steps that run only when certificate secrets
        are present

        - Remove unused Sentry and Amplitude analytics tokens from the publish
        action

        - Gate macOS and Windows signing in forge.config.ts on signing secrets
        so unsigned builds skip code-signing cleanly
      footer: {}
      author: FireRat
    - subject: Remove success and featured project webviews, forward renderer logs,
        and rebuild sidecar on Node 20
      hash: 5f2f609b65ece70f4d28b20673f5663e1b934d6f
      body: >-
        - Drop the success banner webview from the finish page and the featured
        project webview from the main page, simplifying the main page into a
        plain flashing/non-flashing layout

        - Forward renderer console output to the terminal via IPC
        (console-forwarder + main process handler)

        - Target Node 20 for the pkg sidecar binary and note the mountutils
        rebuild requirement
      footer: {}
      author: FireRat
    - subject: Fix target selection crash, harden sidecar requests, and restore winusb
        driver support on Node 20
      hash: d5f71c09f6b710038f10bd459c8d3a2238e975c4
      body: ""
      footer: {}
      author: FireRat
    - subject: Make internal windows robust and replace electron-log with the builtin
        console logger
      hash: 327d7cddfcb9b4bbcd12e06e7da86083dc1a8e64
      body: >-
        Rework open-internal into a shared internal-window module used by both
        the

        main process and the remote renderer service, so any URL type
        (http/https,

        chrome://, file://, etc.) opens in a properly secured BrowserWindow.


        Add a did-fail-load handler and catch load errors to render a dark error
        page

        in the window instead of leaving a blank one, and re-open target=_blank
        and

        window.open popups as new internal windows.


        Replace every electron-log call with the builtin console logger
        (info/warn/

        error) across the main process and renderer, so all log output goes to
        the

        console and no log files are written.


        Remove the electron-log dependency from package.json and
        npm-shrinkwrap.json.


        Drop the unused SENTRY_TOKEN DefinePlugin from webpack.config.ts, the
        last

        remaining Sentry reference in the codebase.


        Clear the completed TODO.md items.
      footer: {}
      author: FireRat
    - subject: Remove stale telemetry alert and rename window title
      hash: 041147249ba2a61662cfc5a0a2afa2df7b48399b
      body: >-
        - Remove the analytics opt-out banner from the main page, along with its
        state, localStorage key, and dismiss handler

        - Drop the hideAnalyticsAlert prop plumbing from source and target
        selectors

        - Rename the window title from Etcher-ng to Etcher Privacy
      footer: {}
      author: FireRat
    - subject: Fix TypeScript module resolution for NodeNext
      hash: 55bf9137d4de3814add462e35181d0508deb4af7
      body: >-
        - Switch main and sidecar tsconfigs from CommonJS to NodeNext/Node16
        module resolution

        - Replace namespace imports with default imports for CJS packages
        (debug, electron-store, electron-context-menu)

        - Add typings for pretty-bytes

        - Enable skipLibCheck for the main tsconfig

        - Load @wdio/globals dynamically in e2e test and use WebdriverIO.Config
        type in wdio config
      footer: {}
      author: FireRat
    - subject: Rebrand to Etcher Privacy and fix build on forge 7.8.1
      hash: 1f4d02cbab3ea8d1338f99e9dafe2b5ffacb2f48
      body: ""
      footer: {}
      author: FireRat
    - subject: fix
      hash: 4ac8b305309aa090eb82206ce2edf9fcc60fdc96
      body: ""
      footer: {}
      author: Alexander Frick
    - subject: 1.19.22 rebase
      hash: c9e9e6b7b3e75a8d03f0adf4755ea424b28633dc
      body: ""
      footer: {}
